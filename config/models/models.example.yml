# Model catalog — the single source of truth for every tool in the sandbox.
# Managed by the "Model configuration" entry in the browser session menu (scripts/model-config.sh);
# hand-editing is fine too. Copy to models.yml to start from this example.
#
# servers.<name>.models.<id>   id = the exact id from GET <url>/models
#   name            display name in tool pickers
#   context         context window (max_model_len from GET <url>/models)
#   max_tokens      max completion tokens
#   vision          can this model see images? (the server can't tell us — set it yourself)
# (Every model is routed through the reasoning-normalizer, which fixes DeepSeek-style fused
#  reasoning+content deltas and is a no-op otherwise — nothing to configure per model.)
# roles: exactly one brain and one vision (vision may equal brain). Every other model in the
# catalog is still selectable inside the tools (Claude Code /model, opencode, omp pickers).
servers:
  spark-brain:
    url: http://10.0.0.25:8888/v1
    models:
      deepseek-v4-flash-0731:
        name: DeepSeek V4 Flash 0731
        context: 1000000
        max_tokens: 16384
        vision: false
  spark-vision:
    url: http://10.0.0.13:8000/v1
    models:
      qwen3.6-35b:
        name: Qwen3.6 35B A3B
        context: 131072
        max_tokens: 16384
        vision: true
roles:
  brain: spark-brain/deepseek-v4-flash-0731
  vision: spark-vision/qwen3.6-35b
